name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  docker:
    name: build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc-ar
      # Explicit --target builds make cc-rs look for triple-prefixed tools;
      # pin them so the build does not depend on what the runner image ships.
      CC_x86_64_unknown_linux_gnu: gcc
      AR_x86_64_unknown_linux_gnu: gcc-ar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-gnu

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Releases run on tags, not the default branch; without this every
          # tag would recompile the whole dependency tree from scratch.
          save-if: true

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --verbose

      - name: Install the aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu

      - name: Cross-compile release binaries for both architectures
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-gnu
          cargo build --release --locked --target aarch64-unknown-linux-gnu
          mkdir -p dist/amd64 dist/arm64
          cp target/x86_64-unknown-linux-gnu/release/llm-proxy dist/amd64/
          cp target/aarch64-unknown-linux-gnu/release/llm-proxy dist/arm64/

      - name: Compute image version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/}"
          version="${version#v}"
          if [[ ! "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Invalid tag for Docker image: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: crpi-gz6f3ok0ezphywc8.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/42tr/llm_proxy:${{ steps.meta.outputs.version }}
            ghcr.io/42tr/llm_proxy:latest
            crpi-gz6f3ok0ezphywc8.cn-shanghai.personal.cr.aliyuncs.com/42tr/llm_proxy:${{ steps.meta.outputs.version }}
            crpi-gz6f3ok0ezphywc8.cn-shanghai.personal.cr.aliyuncs.com/42tr/llm_proxy:latest
