[package]
name = "llm-proxy"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Single-process OpenAI-compatible chat/completions proxy with a browser-managed SQLite configuration"
license = "MIT"

[[bin]]
name = "llm-proxy"
path = "src/main.rs"

[lib]
name = "llm_proxy"
path = "src/lib.rs"

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.2"
hmac = "0.12"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps JSON key order, so logged records and stored headers
# round-trip in the order they were written, like the Python service did.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2.6"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
url = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# `panic = "abort"` is deliberately not set: `handle` wraps each request in
# `catch_unwind` so one bad request cannot take down the whole proxy.

[profile.dev]
debug = "line-tables-only"
